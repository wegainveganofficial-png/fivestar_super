<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0E5A4C">
<title>หอพักจดง่าย · ห้าดาว</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anuphan:wght@500;600;700&family=IBM+Plex+Sans+Thai:wght@400;500;600&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
*{box-sizing:border-box} html{color-scheme:light} :root{padding-top:env(safe-area-inset-top,0px)} body{margin:0} img{max-width:100%} [hidden]{display:none!important}
/* Layout: mobile app shell — sticky month header, room-board grid by floor, fixed bottom tab bar; bottom sheet for details */
:root{
  --bg:#EEF2F0; --surface:#FFFFFF; --sunk:#F5F8F6; --ink:#15221E; --muted:#5A6B65; --line:#D7E0DC;
  --accent:#0E5A4C; --accent-ink:#FFFFFF; --accent-soft:#DDEDE8;
  --paid:#F6C627; --paid-ink:#3B2C00; --paid-soft:#FFF4C9;
  --unpaid:#D63B33; --unpaid-ink:#FFFFFF; --unpaid-soft:#FBE3E1;
  --warn:#B86A00; --ok:#1B7A45;
  --display:"Anuphan","IBM Plex Sans Thai",system-ui,sans-serif;
  --body:"IBM Plex Sans Thai","Anuphan",system-ui,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1412; --surface:#16201D; --sunk:#111916; --ink:#E6EEEA; --muted:#94A49F; --line:#27352F;
  --accent:#4FC0A5; --accent-ink:#06201A; --accent-soft:#173630;
  --paid:#E8B917; --paid-ink:#2A1F00; --paid-soft:#3A3113;
  --unpaid:#E0473F; --unpaid-ink:#FFFFFF; --unpaid-soft:#3D1D1B;
  --warn:#F0A63A; --ok:#5BD08E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1412; --surface:#16201D; --sunk:#111916; --ink:#E6EEEA; --muted:#94A49F; --line:#27352F;
  --accent:#4FC0A5; --accent-ink:#06201A; --accent-soft:#173630;
  --paid:#E8B917; --paid-ink:#2A1F00; --paid-soft:#3A3113;
  --unpaid:#E0473F; --unpaid-ink:#FFFFFF; --unpaid-soft:#3D1D1B;
  --warn:#F0A63A; --ok:#5BD08E; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.5;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.25}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums}
.wrap{max-width:1040px;margin:0 auto;padding-inline:16px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);border-bottom:1px solid var(--line)}
header.top .wrap{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{flex:1;min-width:0}
.brand h1{font-size:18px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{color:var(--muted);font-size:12px}
.monthsw{display:flex;align-items:center;background:var(--surface);border:1px solid var(--line);border-radius:999px}
.monthsw button{border:0;background:none;width:36px;height:36px;border-radius:999px;cursor:pointer;font-size:18px;color:var(--muted)}
.monthsw button:hover{background:var(--sunk);color:var(--ink)}
.monthsw span{font-family:var(--display);font-weight:600;font-size:14px;min-width:112px;text-align:center}
main{padding-block:16px 110px}
.demo{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:10px 14px;font-size:13px;margin-bottom:14px}
.demo b{font-family:var(--display)}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
nav.tabs .wrap{display:grid;grid-template-columns:repeat(6,1fr);padding-inline:2px}
nav.tabs button{border:0;background:none;padding:8px 2px 9px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11.5px;color:var(--muted);cursor:pointer}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--accent);font-weight:600}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px solid var(--line);background:var(--surface);border-radius:9px;padding:9px 14px;cursor:pointer;font-weight:500;min-height:40px}
.btn:hover{border-color:var(--muted)}
.btn.pri{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.red{background:var(--unpaid);color:var(--unpaid-ink);border-color:var(--unpaid)}
.btn.yel{background:var(--paid);color:var(--paid-ink);border-color:var(--paid)}
.btn.ghost{background:none}
.btn.sm{min-height:32px;padding:5px 10px;font-size:13px}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.btn[data-armed]{background:var(--unpaid);color:var(--unpaid-ink);border-color:var(--unpaid)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.muted{color:var(--muted)}
.small{font-size:13px}
.label{font-size:11.5px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
/* summary */
.summary{display:grid;gap:12px;margin-bottom:16px}
.collect .big{font-family:var(--mono);font-size:26px;font-weight:600;font-variant-numeric:tabular-nums}
.bar{height:8px;border-radius:99px;background:var(--unpaid-soft);overflow:hidden;margin-top:8px}
.bar i{display:block;height:100%;background:var(--paid)}
.bar.split{display:flex}
.bar.split i.c{background:repeating-linear-gradient(135deg,var(--paid) 0 5px,var(--paid-soft) 5px 8px)}
.paysplit{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
.pay{display:flex;gap:10px;align-items:flex-start;text-align:left;border:1px solid var(--line);background:var(--sunk);border-radius:9px;padding:9px 11px;cursor:pointer;min-width:0}
.pay[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.pay > span:last-child{display:grid;min-width:0}
.pay b{font-size:16px}
.pay small{color:var(--muted);font-size:12px}
.sw{width:14px;height:14px;border-radius:3px;flex:none;margin-top:3px}
.sw.sx{background:var(--paid)} .sw.sc{background:repeating-linear-gradient(135deg,var(--paid) 0 3px,var(--paid-soft) 3px 5px);box-shadow:inset 0 0 0 1px var(--paid)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.dot.p{background:var(--paid)} .dot.u{background:var(--unpaid)} .dot.k{background:var(--unpaid);box-shadow:inset 0 0 0 2px var(--paid)} .dot.n{border:1.5px dashed var(--muted)} .dot.v{background:repeating-linear-gradient(45deg,var(--line) 0 2px,transparent 2px 4px);border:1px solid var(--line)}
/* board */
.floor{margin-bottom:18px}
.floor h3{font-size:14px;color:var(--muted);font-weight:600;margin-bottom:8px}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(104px,1fr));gap:10px}
.room{position:relative;border-radius:10px;padding:10px 10px 9px;text-align:left;cursor:pointer;border:1.5px solid transparent;min-height:98px;display:flex;flex-direction:column;gap:2px;transition:transform .12s}
.room:hover{transform:translateY(-1px)}
.room .no{font-family:var(--mono);font-size:21px;font-weight:600;line-height:1.1}
.room .who{font-size:12px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.room .amt{margin-top:auto;font-family:var(--mono);font-size:13px;font-weight:600}
.room .tag{position:absolute;top:8px;right:8px;font-size:10.5px;font-weight:600;border-radius:5px;padding:1px 5px}
.room.paid{background:var(--paid);color:var(--paid-ink)}
.room.paid .tag{background:rgba(0,0,0,.12)}
.room.unpaid{background:var(--unpaid);color:var(--unpaid-ink)}
.room.unpaid .tag{background:rgba(255,255,255,.22)}
.room.pending{background:var(--unpaid);color:var(--unpaid-ink);border-color:var(--paid);box-shadow:inset 0 0 0 2px var(--paid)}
.room.pending .tag{background:var(--paid);color:var(--paid-ink)}
.room.none{background:var(--surface);border:1.5px dashed var(--muted);color:var(--ink)}
.room.none .amt{color:var(--muted);font-family:var(--body);font-weight:500}
.room.vacant{background:repeating-linear-gradient(45deg,var(--sunk) 0 6px,var(--surface) 6px 12px);border-color:var(--line);color:var(--muted)}
@media (prefers-reduced-motion:reduce){.room{transition:none}}
/* meter */
.meters{display:grid;gap:10px}
.mrow{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:grid;gap:10px}
.mrow.done{border-left:4px solid var(--ok)}
.mrow.locked{opacity:.7}
.mhead{display:flex;align-items:baseline;gap:10px}
.mhead .no{font-family:var(--mono);font-size:20px;font-weight:600}
.mgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field .prev{font-size:12px;color:var(--muted)}
input.inp,select.inp,textarea.inp{width:100%;border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 11px;min-height:42px}
input.meter{font-family:var(--mono);font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:.02em}
input.inp:focus,select.inp:focus,textarea.inp:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.mcalc{font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;align-items:center}
.mcalc b{font-family:var(--mono)}
.err{color:var(--unpaid);font-size:13px}
.linkbtn{border:0;background:none;padding:0 2px;color:var(--accent);font-size:12px;text-decoration:underline;cursor:pointer}
.prevedit{display:flex;align-items:center;gap:6px;margin-top:4px}
.prevedit label{margin:0;white-space:nowrap}
.prevedit .inp{min-height:32px;padding:4px 8px;font-size:14px;width:100%;background:var(--paid-soft);border-color:var(--paid)}
.inrow{display:flex;gap:6px;align-items:stretch}
.inrow .inp{flex:1;min-width:0}
.cam{position:relative;display:inline-grid;place-items:center;width:46px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;color:var(--accent)}
.cam:hover{border-color:var(--accent)}
.cam svg{width:22px;height:22px}
.cam input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.mph{display:flex;gap:8px;align-items:center;margin-top:6px;font-size:12px}
.mph img{width:52px;height:52px;object-fit:cover;border-radius:6px;border:1px solid var(--line);cursor:zoom-in;flex:none}
.mph .ok{color:var(--ok)} .mph .warn{color:var(--warn)}
.photos{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.photos figure{margin:0;display:grid;gap:4px}
.photos img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:8px;border:1px solid var(--line);cursor:zoom-in;max-width:100%}
.photos img.big{aspect-ratio:auto;object-fit:contain;cursor:zoom-out}
.photos figure:has(img.big){grid-column:1/-1}
.photos figcaption{font-size:12px;color:var(--muted)}
.progress{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.progress .bar{flex:1;margin:0;background:var(--line)}
.progress .bar i{background:var(--ok)}
/* sheet */
.overlay{position:fixed;inset:0;background:rgba(10,20,17,.45);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:90%;overflow:auto;border-radius:16px 16px 0 0;padding:16px 16px calc(20px + env(safe-area-inset-bottom,0px))}
@media (min-width:700px){.overlay{align-items:center}.sheet{border-radius:16px;max-height:86%}}
.sheet .grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:0 auto 10px}
.shead{display:flex;gap:10px;align-items:flex-start;margin-bottom:12px}
.shead .no{font-family:var(--mono);font-size:28px;font-weight:600;line-height:1}
.x{margin-left:auto;border:0;background:var(--sunk);width:34px;height:34px;border-radius:99px;cursor:pointer;font-size:18px;flex:none}
.pill{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12.5px;font-weight:600}
.pill.paid{background:var(--paid);color:var(--paid-ink)} .pill.unpaid{background:var(--unpaid);color:var(--unpaid-ink)} .pill.pending{background:var(--paid-soft);color:var(--ink);box-shadow:inset 0 0 0 1.5px var(--paid)} .pill.none{background:var(--sunk);color:var(--muted)}
table.bill{width:100%;border-collapse:collapse;font-size:14px}
table.bill td{padding:7px 0;border-bottom:1px solid var(--line);vertical-align:top}
table.bill td:last-child{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;white-space:nowrap;padding-left:10px}
table.bill td small{display:block;color:var(--muted);font-size:12px}
table.bill tr.total td{border-bottom:0;font-weight:600;font-size:17px;padding-top:10px}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13.5px}
.kv dt{color:var(--muted)} .kv dd{margin:0;min-width:0;overflow-wrap:anywhere}
.aptid{font-family:var(--mono);font-weight:600;background:var(--sunk);border:1px dashed var(--line);border-radius:6px;padding:1px 7px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:14px}
.actions .full{grid-column:1/-1}
.sect{margin-top:16px;display:grid;gap:10px}
.qrbox{display:grid;justify-items:center;gap:6px;background:#FFFFFF;color:#111;border-radius:12px;padding:14px;border:1px solid var(--line)}
.qrbox canvas{width:220px;height:220px;image-rendering:pixelated;max-width:100%}
.qrbox .pp{font-weight:700;color:#0B3D66;font-family:var(--display);letter-spacing:.02em}
.qrimg{width:240px;max-width:100%;height:auto;border-radius:6px}
.bankline{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;background:var(--sunk);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-top:8px}
.qrset{display:flex;gap:12px;align-items:flex-start;flex-wrap:wrap}
.qrset img,.qrset .qrph{width:130px;height:130px;object-fit:contain;border-radius:8px;border:1px solid var(--line);background:#FFFFFF;flex:none}
.qrset .qrph{display:grid;place-items:center;font-size:12px;color:var(--muted);background:var(--sunk)}
.rcwrap{overflow:hidden;border:1px solid var(--line);border-radius:8px;background:#FFFFFF;width:100%;aspect-ratio:560/780;position:relative}
.rcscale{position:absolute;top:0;left:0;transform-origin:0 0}
.rcchk{width:20px;height:20px;accent-color:var(--accent);flex:none}
.slipimg{max-height:420px;width:auto;border-radius:8px;border:1px solid var(--line);display:block;margin:0 auto}
.verify{border-radius:8px;padding:10px 12px;font-size:13.5px;background:var(--sunk)}
.verify.ok{background:var(--paid-soft)} .verify.bad{background:var(--unpaid-soft)}
.upload{display:grid;place-items:center;gap:4px;border:2px dashed var(--line);border-radius:12px;padding:18px;text-align:center;cursor:pointer;background:var(--sunk)}
.upload:hover{border-color:var(--accent)}
.upload input{position:absolute;width:1px;height:1px;opacity:0}
/* report */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.kpi .v{font-family:var(--mono);font-size:21px;font-weight:600;font-variant-numeric:tabular-nums;margin-top:2px}
.kpi .v.pos{color:var(--ok)} .kpi .v.neg{color:var(--unpaid)}
.twocol{display:grid;gap:14px}
@media (min-width:820px){.twocol{grid-template-columns:1.3fr 1fr}}
.twocol > *,.kpis > *,.tcols > *,.setgrid > *,.summary > *{min-width:0}
.chartwrap{overflow-x:auto}
.chart text{fill:var(--muted);font-family:var(--body);font-size:11px}
.chart .gl{stroke:var(--line)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--muted);margin-top:6px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.brk{display:grid;gap:8px}
.brk .l{display:flex;justify-content:space-between;font-size:13.5px}
.brk .t{height:6px;border-radius:9px;background:var(--sunk);overflow:hidden}
.brk .t i{display:block;height:100%;background:var(--accent)}
.list{display:grid}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-bottom:1px solid var(--line);font-size:14px}
.li:last-child{border-bottom:0}
.li .grow{flex:1;min-width:0}
.li .amt{font-family:var(--mono);font-variant-numeric:tabular-nums}
.form{display:grid;gap:10px}
.form .g2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.form .g3{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
@media (max-width:420px){.form .g3{grid-template-columns:1fr 1fr}}
.stack{display:grid;gap:14px}
h2.sec{font-size:17px;margin-bottom:10px}
.empty{text-align:center;padding:36px 16px;display:grid;gap:10px;justify-items:center}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font-size:14px;z-index:60;max-width:calc(100% - 32px)}
.steps{display:flex;gap:6px;font-size:12px}
.steps span{flex:1;text-align:center;padding:6px 4px;border-radius:7px;background:var(--sunk);color:var(--muted)}
.steps span.on{background:var(--accent);color:var(--accent-ink);font-weight:600}
.hist{display:flex;gap:6px;flex-wrap:wrap}
.hist span{font-size:12px;border-radius:6px;padding:3px 8px}
.hist .p{background:var(--paid);color:var(--paid-ink)} .hist .u{background:var(--unpaid);color:var(--unpaid-ink)} .hist .k{background:var(--paid-soft)}
.spin{display:inline-block;width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:99px;animation:sp 0.8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}

/* view toggle + table */
.filters{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;padding:6px 12px;font-size:13px;cursor:pointer;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.tablewrap{overflow-x:auto}
table.rt{width:100%;border-collapse:collapse;font-size:13.5px;min-width:860px}
table.rt th{position:sticky;top:0;background:var(--sunk);text-align:left;font-weight:600;font-size:12px;color:var(--muted);padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rt td{padding:8px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
table.rt .n{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
table.rt td.t{max-width:200px;overflow:hidden;text-overflow:ellipsis}
table.rt tbody tr{cursor:pointer}
table.rt tbody tr:hover{background:var(--accent-soft)}
table.rt tfoot td{font-weight:600;background:var(--sunk);border-bottom:0}
.navbrand{display:none}
.tcols,.setgrid{display:grid;gap:14px}

/* ---------- desktop ---------- */
@media (min-width:900px){
  body{padding-left:232px}
  .wrap{max-width:1240px;padding-inline:28px}
  header.top .wrap{padding-block:14px}
  .brand h1{font-size:22px}
  main{padding-block:22px 48px}
  nav.tabs{top:0;right:auto;width:232px;border-top:0;border-right:1px solid var(--line);padding:calc(18px + env(safe-area-inset-top,0px)) 0 18px}
  nav.tabs .wrap{display:flex;flex-direction:column;gap:2px;padding-inline:12px;height:100%}
  .navbrand{display:grid;gap:2px;padding:4px 12px 18px;margin-bottom:8px;border-bottom:1px solid var(--line)}
  .navbrand b{font-family:var(--display);font-size:17px;color:var(--accent)}
  .navbrand span{font-size:12.5px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

const snake = k => k.replace(/[A-Z]/g, c => "_" + c.toLowerCase());
const camel = k => k.replace(/_([a-z])/g, (_, c) => c.toUpperCase());
const pkOf = col => PK[col] || "id";
function toRow(col, obj, id){
  const row = {}; const allow = COLS[col];
  for(const [k,v] of Object.entries(obj||{})){ const sk = snake(k); if(allow.includes(sk) && v !== undefined) row[sk] = (v === "" && /_at$/.test(sk) && col==="bills") ? null : v; }
  if(id !== undefined) row[pkOf(col)] = id;

}
function fromRow(row){ const o = {}; for(const [k,v] of Object.entries(row||{})){ if(v !== null) o[camel(k)] = v; } return o; }

async function patch(col, id, data){

  const { error } = await sb.from(TABLE[col]).update(row).eq(pkOf(col), id); sbErr(error);

function calcBill(room, wPrev, wCurr, ePrev, eCurr, wReset, eReset, other){
  const st = S.settings;
  const wu = wReset ? wCurr : Math.max(0, wCurr - wPrev);
  const eu = eReset ? eCurr : Math.max(0, eCurr - ePrev);
  const water = Math.max(r2(wu * st.waterRate), Number(st.waterMin)||0);
  const elec = r2(eu * st.elecRate);
  const rent = Number(room.rent)||0, trash = Number(st.trash)||0, oth = Number(other)||0;
  return {waterUnits:wu, elecUnits:eu, water, elec, rent, trash, other:oth, total:r2(rent+water+elec+trash+oth),
    waterRate:st.waterRate, waterMin:Number(st.waterMin)||0, elecRate:st.elecRate};
}

/* ---------- PromptPay QR (EMVCo) ---------- */
function crc16(s){ let crc = 0xFFFF; for(let i=0;i<s.length;i++){ crc ^= s.charCodeAt(i) << 8; for(let j=0;j<8;j++) crc = (crc & 0x8000) ? ((crc << 1) ^ 0x1021) & 0xFFFF : (crc << 1) & 0xFFFF; } return crc.toString(16).toUpperCase().padStart(4,"0"); }
function ppPayload(id, amount){
  let t = String(id||"").replace(/[^0-9]/g,""); if(!t) return null;
  const f = (k,v) => k + String(v.length).padStart(2,"0") + v;
  let tag;
  if(t.length >= 15) tag = "03";
  else if(t.length >= 13) tag = "02";
  else { tag = "01"; t = ("0000000000000" + t.replace(/^0/,"66")).slice(-13); }
  let d = f("00","01") + f("01", amount ? "12" : "11") + f("29", f("00","A000000677010111") + f(tag,t)) + f("58","TH") + f("53","764");
  if(amount) d += f("54", Number(amount).toFixed(2));
  d += "6304"; return d + crc16(d);
}
function drawQR(canvas, text){
  if(typeof qrcode !== "function"){ canvas.replaceWith(Object.assign(document.createElement("div"),{className:"small",textContent:"โหลดตัวสร้าง QR ไม่ได้"})); return; }
  const q = qrcode(0,"M"); q.addData(text); q.make();
  const n = q.getModuleCount(), m = 3, cell = Math.floor(440/(n+m*2)), size = cell*(n+m*2);
  canvas.width = canvas.height = size; const c = canvas.getContext("2d");
  c.fillStyle = "#FFFFFF"; c.fillRect(0,0,size,size); c.fillStyle = "#000000";
  for(let r=0;r<n;r++) for(let k=0;k<n;k++) if(q.isDark(r,k)) c.fillRect((k+m)*cell,(r+m)*cell,cell,cell);
}

function compressImage(file, maxSide=900, quality=.72, limit=200000){
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onerror = () => rej(new Error("read"));
    fr.onload = () => { const img = new Image(); img.onerror = () => rej(new Error("decode")); img.onload = () => {
      let max = maxSide, q = quality, out;
      for(let i=0;i<6;i++){
        const sc = Math.min(1, max/Math.max(img.width,img.height)); const cv = document.createElement("canvas");
        cv.width = Math.round(img.width*sc); cv.height = Math.round(img.height*sc);
        const cx = cv.getContext("2d"); cx.fillStyle="#fff"; cx.fillRect(0,0,cv.width,cv.height); cx.drawImage(img,0,0,cv.width,cv.height);
        out = cv.toDataURL("image/jpeg", q); if(out.length < limit) break; max *= .8; q = Math.max(.4, q-.08);
      }
      res(out); }; img.src = fr.result; };
    fr.readAsDataURL(file);
  });
}
function dataUrlToBlob(u){ const [h,b] = u.split(","); const bin = atob(b); const a = new Uint8Array(bin.length); for(let i=0;i<bin.length;i++) a[i]=bin.charCodeAt(i); return new Blob([a],{type:(h.match(/data:(.*?);/)||[])[1]||"image/jpeg"}); }

async function autoVerify(id, blob){
  const b = S.bills[id]; if(!b) return;
  const manual = note => patch("bills", id, {verify:{state:"manual", note, amount:null, ref:null}});
  if(!S.sample) return manual("รอเจ้าของหอตรวจสลิป");
  const lim = await S.sample.limits().catch(()=>null);
  if(!lim || !lim.images) return manual("รอเจ้าของหอตรวจสลิป");
  S.busy[id] = "verify"; render();
  try{
    const prompt = `The attached image should be a Thai bank or PromptPay transfer slip (สลิปโอนเงิน). Read it carefully.
Reply with ONLY a JSON object with these keys:
{"isSlip": boolean (true only if this is a real-looking completed transfer slip),
 "amount": number or null (the transferred amount in THB, digits only, e.g. 4538.00),
 "dateTime": string or null (as printed),
 "bank": string or null,
 "senderName": string or null,
 "receiverName": string or null,
 "transRef": string or null (the transaction reference / เลขที่รายการ)}`;
    const r = await S.sample.json(prompt, {images: blob, modelTier:"default"});
    const amt = Number(r && r.amount);
    const cur = S.bills[id] || b;
    const dup = r && r.transRef && Object.values(S.bills).some(x => x.id!==id && x.verify && x.verify.ref && x.verify.ref === r.transRef);
    const base = {amount: isFinite(amt)?amt:null, ref: r.transRef||null, bank: r.bank||null, dateTime: r.dateTime||null, sender: r.senderName||null, receiver: r.receiverName||null};
    if(!r || !r.isSlip) return patch("bills", id, {verify:{...base, state:"mismatch", note:"รูปนี้ไม่ใช่สลิปโอนเงิน หรืออ่านไม่ชัด"}});
    if(dup) return patch("bills", id, {verify:{...base, state:"mismatch", note:"เลขที่รายการนี้เคยใช้กับบิลอื่นแล้ว"}});
    if(!isFinite(amt) || Math.abs(amt - cur.total) > 0.009) return patch("bills", id, {verify:{...base, state:"mismatch", note:`ยอดในสลิป ${isFinite(amt)?baht(amt):"อ่านไม่ได้"} ไม่ตรงกับบิล ${baht(cur.total)}`}});
    await patch("bills", id, {status:"paid", method:"transfer", paidAt:new Date().toISOString(), verify:{...base, state:"auto-ok", note:"ยอดตรงกับบิล อัปเดตสถานะอัตโนมัติ"}});
    toast("ตรวจสลิปผ่าน ห้อง " + cur.room + " ชำระแล้ว");
  } catch(e){
    console.error(e);
    const why = e && e.code==="not_granted" ? "ไม่ได้อนุญาตให้อ่านสลิปอัตโนมัติ" : e && e.code==="rate_limited" ? "ระบบตรวจอัตโนมัติไม่ว่าง" : "ตรวจอัตโนมัติไม่สำเร็จ";
    await manual(why + " รอเจ้าของหอตรวจ").catch(()=>{});
  } finally { delete S.busy[id]; render(); }
}

function viewRooms(){
  const rs = roomsSorted();
  if(!rs.length) return `<div class="card empty"><h2>ยังไม่มีห้องพัก</h2><p class="muted small">เพิ่มห้องทีละห้องหรือสร้างทั้งชั้นได้ในหน้าตั้งค่า</p><button class="btn pri" data-act="tab" data-v="settings">เพิ่มห้องพัก</button></div>`;
  const occ = rs.filter(r=>!r.vacant);
  const cnt = {paid:0, unpaid:0, pending:0, none:0, vacant:rs.length-occ.length};
  let expect = 0, got = 0, cashAmt = 0, cashN = 0, xferAmt = 0, xferN = 0;
  occ.forEach(r => { const s = statusOf(r); cnt[s]++; const b = billOf(r.no); if(b){ expect += b.total; if(b.status==="paid"){ got += b.total; if(b.method==="cash"){ cashAmt += b.total; cashN++; } else { xferAmt += b.total; xferN++; } } } });
  const pct = expect ? Math.round(got/expect*100) : 0;
  const pctCash = expect ? cashAmt/expect*100 : 0, pctX = expect ? xferAmt/expect*100 : 0;
  const chip = (k, dot, label, n) => `<button class="chip" data-act="filter" data-v="${k}" aria-pressed="${S.filter===k}"><span class="dot ${dot}"></span>${label} <b class="num">${n}</b></button>`;
  const payOf = r => { const b = billOf(r.no); return b && b.status==="paid" ? (b.method==="cash" ? "cash" : "transfer") : null; };
  const show = r => S.filter==="all" || statusOf(r)===S.filter || payOf(r)===S.filter;

function roomsTable(list){

function tile(r){

function viewMeter(){

  if(!occ.length) return `<div class="card empty"><h2>ยังไม่มีห้องที่มีผู้เช่า</h2><button class="btn pri" data-act="tab" data-v="settings">เพิ่มห้องพัก</button></div>`;

function mrow(r){
  const b = billOf(r.no), p = prevReading(r);
  if(b && b.status!=="unpaid") return `<div class="mrow done mini"><div class="mhead"><span class="no">${esc(r.no)}</span><span class="small" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.tenant)}</span><span class="pill ${b.status}">${STATUS_TH[b.status]}</span></div><div class="mcalc">${calcLine(b)}</div></div>`;
  const d = S.draft[r.no] || {};
  const wPrev = d.wp !== undefined ? Number(d.wp)||0 : (b ? b.waterPrev : p.w), ePrev = d.ep !== undefined ? Number(d.ep)||0 : (b ? b.elecPrev : p.e);
  const locked = b && b.status!=="unpaid";
  const prevLine = (k, pv) => {
    const key = k==="w" ? "wp" : "ep";
    if(!locked && d[key+"Edit"]) return `<div class="prev prevedit"><label for="${key}-${esc(r.no)}">เลขครั้งก่อน</label><input class="inp num prevIn" id="${key}-${esc(r.no)}" data-pk="${key}" inputmode="numeric" value="${esc(d[key]!==undefined?d[key]:pv)}"></div>`;
    return `<div class="prev">ครั้งก่อน <span class="num">${nf(pv)}</span>${locked?"":` <button class="linkbtn" type="button" data-act="editPrev" data-k="${key}" data-v="${esc(r.no)}">แก้เลขตั้งต้น</button>`}</div>`;
  };
  const val = (k, saved) => d[k] !== undefined ? d[k] : (saved ?? "");
  const cam = k => locked ? "" : `<label class="cam" title="ถ่ายรูป${KIND_TH[k]}" aria-label="ถ่ายรูป${KIND_TH[k]} ห้อง ${esc(r.no)}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 8h3l2-3h6l2 3h3v11H4z"/><circle cx="12" cy="13" r="3.5"/></svg><input type="file" accept="image/*" capture="environment" data-mphoto="${k}" data-room="${esc(r.no)}"></label>`;
  const ph = k => {
    const s = (S.mphoto[r.no]||{})[k];
    if(s) return `<div class="mph"><img src="${s.img}" alt="รูป${KIND_TH[k]}" data-act="zoomRow">${s.status==="reading"?`<span><span class="spin"></span> กำลังอ่านเลข</span>`:`<span class="${s.status==="read"?"ok":"warn"}">${esc(s.note||"")}</span>`}</div>`;
    const has = b && (k==="w" ? b.hasWaterPhoto : b.hasElecPhoto);
    return has ? `<div class="mph"><span class="ok">บันทึกรูปแล้ว</span></div>` : "";
  };
  return `<div class="mrow ${b?"done":""} ${locked?"locked":""}" id="mr-${esc(r.no)}" data-room="${esc(r.no)}" data-wp="${wPrev}" data-ep="${ePrev}" ${d.wr?'data-wr="1"':""} ${d.er?'data-er="1"':""}>
    <div class="mhead"><span class="no">${esc(r.no)}</span><span class="small grow" style="flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(r.tenant)}</span>${b?`<span class="pill ${b.status}">${STATUS_TH[b.status]}</span>`:""}</div>
    <div class="mgrid">
      <div class="field"><label for="w-${esc(r.no)}">มิเตอร์น้ำ (ลบ.ม.)</label><div class="inrow"><input class="inp meter" id="w-${esc(r.no)}" inputmode="numeric" pattern="[0-9]*" placeholder="${wPrev}" value="${esc(val("w", b&&b.waterCurr))}" ${locked?"disabled":""}>${cam("w")}</div>${prevLine("w", wPrev)}${ph("w")}</div>
      <div class="field"><label for="e-${esc(r.no)}">มิเตอร์ไฟ (หน่วย)</label><div class="inrow"><input class="inp meter" id="e-${esc(r.no)}" inputmode="numeric" pattern="[0-9]*" placeholder="${ePrev}" value="${esc(val("e", b&&b.elecCurr))}" ${locked?"disabled":""}>${cam("e")}</div>${prevLine("e", ePrev)}${ph("e")}</div>
    </div>
    <div class="mcalc" id="mc-${esc(r.no)}"></div>
    ${locked?`<div class="small muted">บิลนี้${b.status==="paid"?"ชำระแล้ว":"มีสลิปรอตรวจ"} แก้เลขมิเตอร์ไม่ได้</div>`:`<div class="row"><button class="btn pri" data-act="saveMeter" data-v="${esc(r.no)}" style="flex:1">${b?"บันทึกการแก้ไข":"บันทึก"}</button>${b?`<button class="btn ghost" data-act="clearReading" data-v="${esc(r.no)}" data-confirm="แตะอีกครั้งเพื่อล้าง">ล้างเลขเดือนนี้</button>`:""}</div>`}
  </div>`;
}
function readRow(no){
  const row = document.getElementById("mr-"+no); if(!row) return null;
  const wIn = document.getElementById("w-"+no), eIn = document.getElementById("e-"+no);
  const dr = S.draft[no] || {};
  const wp = dr.wp !== undefined ? Number(dr.wp)||0 : Number(row.dataset.wp), ep = dr.ep !== undefined ? Number(dr.ep)||0 : Number(row.dataset.ep);
  const wv = wIn.value.trim(), ev = eIn.value.trim();
  const w = wv===""?null:Number(wv), e = ev===""?null:Number(ev);
  return {row, wp, ep, w, e, wReset: row.dataset.wr==="1", eReset: row.dataset.er==="1"};
}
function updateCalc(no){
  const d = readRow(no); if(!d) return;
  const out = document.getElementById("mc-"+no); const room = S.rooms[no]; const b = billOf(no);
  if(d.w===null && d.e===null){ out.innerHTML = b ? calcLine(b) : ""; return; }
  let msg = "";
  if(d.w!==null && d.w < d.wp && !d.wReset) msg += `<span class="err">เลขน้ำน้อยกว่าครั้งก่อน</span> <button class="btn sm" data-act="reset" data-k="wr" data-v="${esc(no)}">นับเป็นมิเตอร์น้ำใหม่</button> `;
  if(d.e!==null && d.e < d.ep && !d.eReset) msg += `<span class="err">เลขไฟน้อยกว่าครั้งก่อน</span> <button class="btn sm" data-act="reset" data-k="er" data-v="${esc(no)}">นับเป็นมิเตอร์ไฟใหม่</button>`;
  if(msg){ out.innerHTML = msg; return; }
  if(d.w===null || d.e===null){ out.innerHTML = `<span class="muted">กรอกให้ครบทั้งน้ำและไฟ</span>`; return; }
  const c = calcBill(room, d.wp, d.w, d.ep, d.e, d.wReset, d.eReset, b?b.other:0);
  out.innerHTML = calcLine(c) + (d.wReset||d.eReset?` <span class="small" style="color:var(--warn)">มิเตอร์ใหม่</span>`:"");
}
const calcLine = c => `<span>น้ำ <b>${nf(c.waterUnits)}</b> หน่วย = <b>${baht(c.water)}</b></span><span>ไฟ <b>${nf(c.elecUnits)}</b> หน่วย = <b>${baht(c.elec)}</b></span><span>รวมบิล <b>${baht(c.total)}</b></span>`;

async function saveMeter(no){
  const d = readRow(no), room = S.rooms[no];
  if(!d || d.w===null || d.e===null || !isFinite(d.w) || !isFinite(d.e)) return toast("กรอกเลขมิเตอร์น้ำและไฟให้ครบ");
  if((d.w < d.wp && !d.wReset) || (d.e < d.ep && !d.eReset)) return toast("เลขมิเตอร์น้อยกว่าครั้งก่อน ตรวจเลขอีกครั้ง");
  const id = billId(S.month, no), old = S.bills[id];
  const c = calcBill(room, d.wp, d.w, d.ep, d.e, d.wReset, d.eReset, old?old.other:0);
  const data = {...(old||{}), id, month:S.month, room:no, waterPrev:d.wp, waterCurr:d.w, elecPrev:d.ep, elecCurr:d.e, waterReset:d.wReset, elecReset:d.eReset, ...c, otherNote:(old&&old.otherNote)||"", status:(old&&old.status)||"unpaid", readAt:new Date().toISOString()};
  if(old && old.demo) data.demo = true; else delete data.demo;
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
  const ph = photoRefs(no);
  if((S.mphoto[no]||{}).w && S.mphoto[no].w.status==="reading" || (S.mphoto[no]||{}).e && S.mphoto[no].e.status==="reading") return toast("รอให้อ่านเลขจากรูปเสร็จก่อน");
  if(ph.w || ph.e){
    const prevP = await getDoc("photos", id).catch(()=>null) || {};
    const pdoc = {w: ph.w || prevP.w || null, e: ph.e || prevP.e || null, at:new Date().toISOString()};
    const okP = await safe(async()=>{ await put("photos", id, pdoc); return true; });
    if(!okP) return;
    S.photoCache[id] = pdoc; data.hasWaterPhoto = !!pdoc.w; data.hasElecPhoto = !!pdoc.e;
  }
  const ok = await safe(async()=>{ await put("bills", id, data); return true; });
  if(!ok) return;
  const dr = S.draft[no] || {};
  const hasEarlier = Object.values(S.bills).some(x => x.room===no && x.month < S.month);
  if(!hasEarlier && (dr.wp!==undefined || dr.ep!==undefined) && (room.waterStart!==d.wp || room.elecStart!==d.ep)) await safe(()=>put("rooms", no, {...room, waterStart:d.wp, elecStart:d.ep}));
  delete S.draft[no]; delete S.mphoto[no]; S.justSaved = no; render();
  toast(`ห้อง ${no} รวม ${baht(c.total)}`);
  const occ = occupied(); const i = occ.findIndex(r=>r.no===no);
  const next = occ.slice(i+1).find(r=>!billOf(r.no)) || occ.find(r=>!billOf(r.no));
  if(next) setTimeout(()=>{ const el = document.getElementById("w-"+next.no); if(el){ el.focus({preventScroll:true}); el.closest(".mrow").scrollIntoView({behavior: matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth", block:"center"}); } }, 120);
}

function viewReport(){
  const m = S.month;
  const bills = Object.values(S.bills).filter(b=>b.month===m);
  const paid = bills.filter(b=>b.status==="paid");
  const sum = (arr,k) => r2(arr.reduce((s,x)=>s+(Number(x[k])||0),0));
  const income = sum(paid,"total"), billed = sum(bills,"total"), outstanding = r2(billed-income);
  const exps = Object.values(S.expenses).filter(e=>e.month===m).sort((a,b)=>String(a.date).localeCompare(String(b.date)));
  const expense = sum(exps,"amount"), profit = r2(income-expense);
  const occ = occupied().length, total = roomsSorted().length;
  const parts = [["ค่าห้อง","rent"],["ค่าไฟ","elec"],["ค่าน้ำ","water"],["ค่าขยะ","trash"],["อื่นๆ","other"]].map(([l,k])=>[l,sum(paid,k)]);
  const pmax = Math.max(1,...parts.map(p=>p[1]));
  const cash = sum(paid.filter(b=>b.method==="cash"),"total");
  // 6-month series
  const months = []; for(let k=11;k>=0;k--) months.push(addMonth(m,-k));
  const series = months.map(mm => { const inc = r2(Object.values(S.bills).filter(b=>b.month===mm && b.status==="paid").reduce((s,b)=>s+b.total,0)); const ex = r2(Object.values(S.expenses).filter(e=>e.month===mm).reduce((s,e)=>s+(Number(e.amount)||0),0)); return {mm, inc, ex, pr:r2(inc-ex)}; });
  const cats = ["ค่าไฟการไฟฟ้า","ค่าน้ำประปา","เงินเดือนแม่บ้าน","ซ่อมบำรุง","อินเทอร์เน็ต","ภาษี/ค่าธรรมเนียม","อื่นๆ"];
  return `<div class="kpis">

    <div class="card kpi"><div class="label">ค้างชำระ</div><div class="v ${outstanding>0?"neg":""}">${baht(outstanding)}</div><div class="small muted">${bills.length-paid.length} ห้อง จากบิล ${bills.length}</div></div>
    <div class="card kpi"><div class="label">รายจ่าย</div><div class="v">${baht(expense)}</div><div class="small muted">${exps.length} รายการ</div></div>
    <div class="card kpi"><div class="label">กำไรสุทธิ</div><div class="v ${profit>=0?"pos":"neg"}">${profit<0?"−":""}${baht(Math.abs(profit))}</div><div class="small muted">อัตราเข้าพัก ${total?Math.round(occ/total*100):0}% (${occ}/${total})</div></div>
  </div>
  <div class="twocol">
    <div class="card"><h2 class="sec">รายรับ รายจ่าย 12 เดือน</h2><div class="chartwrap">${chart(series)}</div>
      <div class="legend"><span><i style="background:var(--paid)"></i>รายรับ</span><span><i style="background:var(--muted)"></i>รายจ่าย</span><span><i style="background:var(--accent);height:3px;vertical-align:3px"></i>กำไร</span></div></div>
    <div class="card"><h2 class="sec">รายรับแยกประเภท</h2><div class="brk">${parts.map(([l,v])=>`<div><div class="l"><span>${l}</span><span class="num">${baht(v)}</span></div><div class="t"><i style="width:${v/pmax*100}%"></i></div></div>`).join("")}</div></div>
  </div>
  <div class="twocol" style="margin-top:14px">
    <div class="card"><h2 class="sec">รายจ่าย ${esc(monthTH(m))}</h2>
      <div class="list">${exps.length?exps.map(e=>`<div class="li"><div class="grow"><div>${esc(e.cat)}</div><div class="small muted">${esc(e.note||"")}</div></div><span class="amt">${baht(e.amount)}</span><button class="btn sm ghost" data-act="delExp" data-v="${esc(e.id)}" aria-label="ลบรายการ">ลบ</button></div>`).join(""):`<p class="muted small">ยังไม่มีรายจ่ายเดือนนี้</p>`}</div></div>
    <div class="card"><h2 class="sec">เพิ่มรายจ่าย</h2>
      <form class="form" id="expForm">
        <div><label class="small muted" for="exCat">ประเภท</label><select class="inp" id="exCat">${cats.map(c=>`<option>${c}</option>`).join("")}</select></div>
        <div class="g2"><div><label class="small muted" for="exAmt">จำนวนเงิน (บาท)</label><input class="inp num" id="exAmt" inputmode="decimal" required></div>
        <div><label class="small muted" for="exDate">วันที่</label><input class="inp" id="exDate" type="date" value="${m}-${pad(Math.min(28,new Date().getDate()))}"></div></div>
        <div><label class="small muted" for="exNote">หมายเหตุ</label><input class="inp" id="exNote" placeholder="เช่น ใบแจ้งหนี้ กฟภ."></div>
        <button class="btn pri" type="submit">เพิ่มรายจ่าย</button>
      </form></div>
  </div>`;
}
function chart(series){
  const W=720,H=250,L=54,R=10,T=14,B=30; const iw=W-L-R, ih=H-T-B;
  const maxV = Math.max(1000, ...series.flatMap(s=>[s.inc,s.ex,s.pr]));
  const minV = Math.min(0, ...series.map(s=>s.pr));
  const step = niceStep((maxV-minV)/4); const top = Math.ceil(maxV/step)*step, bot = Math.floor(minV/step)*step;
  const y = v => T + ih - (v-bot)/(top-bot)*ih;
  const bw = iw/series.length; const bar = Math.min(22, bw*0.34);
  let g = "";
  for(let v=bot; v<=top+1e-6; v+=step){ g += `<line class="gl" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke-width="${v===0?1.4:0.8}"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end">${fmtK(v)}</text>`; }
  let bars = "", pts = [];
  series.forEach((s,i) => {
    const cx = L + bw*i + bw/2;
    bars += `<rect x="${cx-bar-1}" y="${Math.min(y(s.inc),y(0))}" width="${bar}" height="${Math.abs(y(0)-y(s.inc))}" rx="2" fill="var(--paid)"><title>รายรับ ${baht(s.inc)}</title></rect>`;
    bars += `<rect x="${cx+1}" y="${Math.min(y(s.ex),y(0))}" width="${bar}" height="${Math.abs(y(0)-y(s.ex))}" rx="2" fill="var(--muted)" opacity=".55"><title>รายจ่าย ${baht(s.ex)}</title></rect>`;
    bars += `<text x="${cx}" y="${H-10}" text-anchor="middle">${esc(monthTH(s.mm,true))}</text>`;
    pts.push([cx, y(s.pr), s]);
  });
  const line = `<polyline points="${pts.map(p=>p[0]+","+p[1]).join(" ")}" fill="none" stroke="var(--accent)" stroke-width="2.2"/>` + pts.map((p,i)=>`<circle cx="${p[0]}" cy="${p[1]}" r="${i===pts.length-1?4.5:3}" fill="var(--accent)" stroke="var(--surface)" stroke-width="1.5"><title>กำไร ${baht(p[2].pr)}</title></circle>`).join("");
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="min-width:560px" role="img" aria-label="กราฟรายรับรายจ่าย 12 เดือน">${g}${bars}${line}</svg>`;
}
function niceStep(x){ const p = Math.pow(10, Math.floor(Math.log10(Math.max(1,x)))); const n = x/p; return (n<=1?1:n<=2?2:n<=5?5:10)*p; }
const fmtK = v => Math.abs(v)>=1000 ? (v/1000).toLocaleString("th-TH",{maximumFractionDigits:1})+"k" : String(v);

function verifyBox(b){
  const v = b.verify || {};
  if(v.state==="checking") return `<div class="verify"><span class="spin"></span> กำลังตรวจสลิป</div>`;
  const cls = v.state==="mismatch" ? "bad" : "";
  return `<div class="verify ${cls}"><b>${v.state==="mismatch"?"สลิปไม่ผ่านการตรวจอัตโนมัติ":"ได้รับสลิปแล้ว"}</b><br>${esc(v.note||"รอเจ้าของหอตรวจ")}${v.amount?`<br>ยอดที่อ่านได้ <span class="num">${baht(v.amount)}</span>`:""}${v.ref?` · อ้างอิง <span class="num">${esc(v.ref)}</span>`:""}</div>`;
}
function qrBlock(b){
  const st = S.settings, pp = st.promptpay, img = st.qrImg;
  if(!img && !pp && !st.bankAcc) return `<div class="verify">เจ้าของหอยังไม่ได้ตั้งค่าช่องทางรับเงิน</div>`;
  const qr = img ? `<img class="qrimg" src="${img}" alt="QR Code รับเงิน">`
    : pp ? `<span class="pp">PromptPay</span><canvas data-qr="${esc(b.id)}" width="220" height="220" aria-label="QR พร้อมเพย์ ยอด ${baht(b.total)}"></canvas>` : "";
  const box = qr ? `<div class="qrbox">${qr}<b style="font-size:20px;font-family:'IBM Plex Mono',monospace">${baht(b.total)}</b><span style="font-size:12.5px">${esc(st.accountName||"")}${pp&&!img?" · "+esc(maskPP(pp)):""}</span>${img?`<span style="font-size:12px">สแกนแล้วใส่ยอดให้ตรงกับบิล</span>`:""}</div>` : "";
  const bank = st.bankAcc ? `<div class="bankline"><div style="min-width:0"><div class="small muted">โอนเข้าบัญชี${st.bank?" ธนาคาร"+esc(st.bank):""}</div><div class="num" style="font-size:17px;font-weight:600">${esc(st.bankAcc)}</div><div class="small">${esc(st.accountName||"")}</div></div><button class="btn sm" data-act="copy" data-v="${esc(String(st.bankAcc).replace(/[^0-9]/g,""))}">คัดลอกเลขบัญชี</button></div>` : "";
  return box + bank;
}
const maskPP = p => { const d = String(p).replace(/\D/g,""); return d.length>6 ? d.slice(0,3)+"-xxx-"+d.slice(-4) : d; };

function openSheet(s){ S.sheet = s; renderSheet(); }
function closeSheet(){ S.sheet = null; renderSheet(); }
function renderSheet(){
  const root = $("#sheetRoot");
  if(!S.sheet){ root.innerHTML = ""; return; }
  const ae = document.activeElement;
  if(ae && root.contains(ae) && ["INPUT","TEXTAREA","SELECT"].includes(ae.tagName) && ae.type!=="file") return;
  const html = S.sheet.kind==="repair" ? sheetRepair(S.sheet.id) : S.sheet.kind==="newRepair" ? sheetNewRepair() : S.sheet.kind==="rc" ? sheetReceipt(S.sheet.id) : S.sheet.kind==="rcimg" ? `<div class="shead"><h2 style="font-size:17px">ใบเสร็จรับเงิน</h2><button class="x" data-act="close" aria-label="ปิด">×</button></div><p class="small muted" style="margin:0 0 10px">บันทึกไฟล์ PDF ในหน้านี้ไม่ได้ กดค้างที่รูปใบเสร็จเพื่อบันทึกรูป แล้วสั่งพิมพ์จากแกลเลอรี</p><div style="display:grid;gap:12px">${S.sheet.imgs.map(im=>`<img src="${im.url}" alt="ใบเสร็จ" style="width:100%;border:1px solid var(--line);border-radius:6px">`).join("")}</div>` : S.sheet.kind==="room" ? sheetRoom(S.sheet.no) + roomRepairsMini(S.sheet.no) : S.sheet.kind==="img" ? `<div class="shead"><h2 style="font-size:17px">รูปภาพ</h2><button class="x" data-act="close" aria-label="ปิด">×</button></div><img src="${S.sheet.src}" alt="รูปมิเตอร์" style="width:100%;border-radius:8px">` : sheetEditRoom(S.sheet.no);
  root.innerHTML = `<div class="overlay" data-act="closeBg"><div class="sheet" role="dialog" aria-modal="true"><div class="grab"></div>${html}</div></div>`;
  loadPhotos(); loadRepairPhotos();
  root.querySelectorAll(".rcwrap").forEach(w => { const sc = w.querySelector(".rcscale"); if(sc) sc.style.transform = `scale(${w.clientWidth/560})`; });
  root.querySelectorAll("canvas[data-qr]").forEach(c => { const b = S.bills[c.dataset.qr]; const p = b && ppPayload(S.settings.promptpay, b.total); if(p) drawQR(c,p); });

  const box = document.getElementById("slipbox"); if(!box || box.dataset.loaded===id) return; box.dataset.loaded = id;

  const el = document.getElementById("slipbox"); if(!el) return;
  el.innerHTML = s && s.img ? `<img class="slipimg" src="${s.img}" alt="สลิปโอนเงิน"><div class="small muted" style="text-align:center">ส่งเมื่อ ${dateTH(s.at)}</div>` : `<div class="small muted">ไม่มีรูปสลิป</div>`;

const ymdTH = y => { if(!y) return "—"; const [a,b,c] = String(y).slice(0,10).split("-").map(Number); return new Intl.DateTimeFormat("th-TH",{day:"numeric",month:"short",year:"2-digit"}).format(new Date(a,b-1,c)); };
const daysSince = y => Math.max(0, Math.round((new Date(todayYMD()) - new Date(String(y).slice(0,10))) / 86400000));

async function submitRepair(prefix, room){
  const note = $("#"+prefix+"Note").value.trim(); if(!note) return toast("ใส่รายละเอียดที่ต้องการซ่อม");
  const id = "rp" + Date.now().toString(36) + Math.random().toString(36).slice(2,5);
  const photo = S.repDraftPhoto && S.repDraftPhoto[prefix];
  const data = {id, room, cat:$("#"+prefix+"Cat").value, note, reportedAt:$("#"+prefix+"Date").value || todayYMD(), status:"new", scheduledAt:"", doneAt:"", ownerNote:"", cost:0, hasPhoto:!!photo, by: prefix==="tr"?"tenant":"owner", createdAt:new Date().toISOString()};
  document.activeElement && document.activeElement.blur && document.activeElement.blur();
  if(S.mode==="tenant"){
    const { data: rid, error } = await sb.rpc("dorm_tenant_new_repair", {p_apt:S.tenantApt, p_cat:data.cat, p_note:note, p_reported:data.reportedAt, p_img:photo||null});
    if(error || !rid) return toast("ส่งแจ้งซ่อมไม่สำเร็จ ลองอีกครั้ง");
    if(photo) S.photoCache["rp_"+rid] = {img:photo};

    toast("ส่งแจ้งซ่อมแล้ว"); await loadTenant(S.tenantApt); render(); return;
  }
  if(photo){ const ok = await safe(async()=>{ await put("repairPhotos", id, {img:photo}); return true; }); if(!ok) return; S.photoCache["rp_"+id] = {img:photo}; }
  const ok = await safe(async()=>{ await put("repairs", id, data); return true; }); if(!ok) return;
  if(S.repDraftPhoto) delete S.repDraftPhoto[prefix];
  const f = $("#"+prefix+"Form"); if(f) f.reset();

}
async function saveRepair(id, forceDone){
  const r = S.repairs[id]; if(!r) return;
  let status = forceDone ? "done" : $("#reStatus").value;
  let sch = forceDone ? (r.scheduledAt || todayYMD()) : $("#reSch").value;
  let done = forceDone ? todayYMD() : $("#reDone").value;
  if(!forceDone){ if(done && status!=="cancelled") status = "done"; else if(sch && status==="new") status = "scheduled"; }
  if(status==="done" && !done) done = todayYMD();
  const cost = forceDone ? (Number($("#reCost") && $("#reCost").value)||r.cost||0) : r2(Number($("#reCost").value)||0);
  const wantExp = $("#reExp") ? $("#reExp").checked : true;
  const upd = {...r, status, scheduledAt:sch||"", doneAt: status==="done" ? done : (done||""), ownerNote: forceDone ? (($("#reNote")&&$("#reNote").value.trim())||r.ownerNote||"") : $("#reNote").value.trim(), cost, reportedAt: forceDone ? r.reportedAt : ($("#reRep").value || r.reportedAt)};

function bahtText(n){
  n = r2(n); const d = ["","หนึ่ง","สอง","สาม","สี่","ห้า","หก","เจ็ด","แปด","เก้า"], p = ["","สิบ","ร้อย","พัน","หมื่น","แสน"];
  const grp = x => { let s = "", str = String(x), L = str.length;
    for(let i=0;i<L;i++){ const c = +str[i], pos = L-i-1; if(!c) continue;
      if(pos===1 && c===1) s += "สิบ"; else if(pos===1 && c===2) s += "ยี่สิบ"; else if(pos===0 && c===1 && L>1) s += "เอ็ด"; else s += d[c] + p[pos]; }
    return s; };
  const read = x => { if(x===0) return "ศูนย์"; let out = "", m = 0; const parts = [];
    while(x>0){ parts.unshift(x % 1000000); x = Math.floor(x/1000000); }
    parts.forEach((g,i)=>{ if(g) out += grp(g); if(i<parts.length-1) out += "ล้าน"; }); return out; };
  const b = Math.floor(n), st = Math.round((n-b)*100);
  return read(b) + "บาท" + (st ? read(st) + "สตางค์" : "ถ้วน");
}

async function printReceipts(){
  const ids = [...S.rcSel].filter(id => S.bills[id] && S.bills[id].status==="paid").sort();
  if(!ids.length) return toast("ติ๊กเลือกใบเสร็จก่อน");
  S.rcBusy = true; render();
  try{
    const imgs = await receiptImages(ids);
    const dl = {save: async ({filename, data}) => { const u = URL.createObjectURL(data); const a = document.createElement("a"); a.href = u; a.download = filename; document.body.appendChild(a); a.click(); a.remove(); setTimeout(()=>URL.revokeObjectURL(u), 30000); return {status:"saved"}; }};
    if(dl){
      await loadScript("https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js");
      const { jsPDF } = window.jspdf;
      const pdf = new jsPDF({unit:"mm", format:"a5", orientation:"portrait"});
      imgs.forEach((im,i) => { if(i) pdf.addPage("a5","portrait"); const W = 148, H = Math.min(210, W*im.h/im.w); pdf.addImage(im.url, "JPEG", 0, 0, W, H); });
      const room = S.bills[ids[0]].room;
      const name = `ใบเสร็จ-ห้อง${room}-${ids.length===1?ids[0].slice(0,7):ids.length+"เดือน"}.pdf`;

  S.rcBusy = false; render();
}

async function resolveLoginEmail(id){
  if(!id) return {error:"กรอกอีเมลหรือเบอร์มือถือก่อน"};
  if(id.includes("@")) return {email: id.toLowerCase()};
  const digits = id.replace(/\D/g, "");
  if(digits.length < 9) return {error:"เบอร์มือถือไม่ถูกต้อง"};
  const { data, error } = await sb.rpc("dorm_login_email", {p_id: digits});
  if(error) return {error:"ยังไม่ได้ตั้งเบอร์มือถือสำหรับเข้าระบบ ใช้อีเมลแทนไปก่อน"};

  return {email: data};
}

  Object.keys(map).forEach(t => ch.on("postgres_changes", {event:"*", schema:"public", table:t}, payload => {
    const col = map[t];
    if(col==="meta"){ if(payload.new && payload.new.id) S.settings = {...DEFAULTS, ...fromRow(payload.new)}; render(); return; }
    const pk = pkOf(col);
    if(payload.eventType==="DELETE"){ const k = payload.old && payload.old[pk]; if(k) delete memCol(col)[k]; }
    else if(payload.new){ memCol(col)[payload.new[pk]] = fromRow(payload.new); }
    render();
  }));
  ch.subscribe();
  document.addEventListener("visibilitychange", () => { if(document.visibilityState==="visible" && S.mode==="owner") scheduleReload(); });

  if(cameFromOAuth){ try{ history.replaceState(null, "", location.pathname); }catch(e){} }
  if(isRecovery && session){ S.mode = "reset"; render(); return; }
  if(oauthErr && !session){ S.mode = "login"; S.loginMsg = "เข้าสู่ระบบด้วย Google ไม่สำเร็จ: " + oauthErr; S.loginErr = true; render(); return; }
  if(session && !aptQ && initialHash!=="tenant"){ await startOwner(session.user); return; }
  if(aptQ || initialHash==="tenant"){
    S.mode = "tenant"; S.tab = "tenant"; S.tenantApt = (aptQ || savedApt || "").toUpperCase();
    if(S.tenantApt){ S.tenantLoading = true; render(); await loadTenant(S.tenantApt); S.tenantLoading = false; }
    render(); return;
  }
  S.mode = "login"; render();
})();
</script>
</body>
</html>
